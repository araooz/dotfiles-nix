
font_size  11
confirm_os_window_close 0
background_opacity 0.8
shell zsh
remember_window_size no

map ctrl+shift+t launch --type=tab --cwd=current

# colores y fuente generados por nix/theme.nix
include theme.conf

# respiro alrededor del texto y pestañas redondeadas
window_padding_width 10
tab_bar_style powerline
tab_powerline_style round
cursor_shape beam 
# la shit esa que deja como una estela con el cursor 
cursor_trail 0  
