$font = JetBrainsMono Nerd Font Propo
source= mocha.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
    animation = inputField, 1, 2, linear
}

background {
    monitor = 
    path = ~/.config/hypr/assets/bg3.jpg
    blur_passes = 3
    blur_size = 3
}
# Profile Picture
image {
    monitor =
    path = ~/.config/hypr/assets/me.jpg
    size = 100
    border_size = 10
    border_color = rgba($textAlpha33)
    position = 0, 200
    halign = center
    valign = bottom
}


#user
label {
    monitor =
    # text = cmd[update:1000] whoami
    text =$USER
    font_family = $font
    color = $light1
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    inner_color = rgba(666666bb)

    outer_color = rgba($textAlpha33)
    check_color = $red
    fail_color = $red

    font_color = rgba($textAlpha99)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =  
    fail_text = NUH UH 

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format =67 
    dots_size = 0.4
    dots_spacing = 0

    position = 0, 80
    halign = center
    valign = bottom
}



# TIME
label {
    monitor =
    text = cmd[update:1]  date +"%l:%M"
    font_size = 120
    font_family = $font black
    position = 0, -200
    halign = center
    valign = top
    color = rgba($textAlpha55)
}

# day
label {
    monitor =
    text = cmd[update:1] date +"%a"
    font_size = 16
    font_family = $font
    position = -150, -380
    halign = center
    valign = top
    color = $text
}

#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = -100, -382
    halign = center
    valign = top
    color=$red
}

# date
label {
    monitor =
    text = cmd[update:1] date +"%e"
    font_size = 16
    font_family = $font
    position = -50, -380
    halign = center
    valign = top
    color = $text
}
#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 0, -382
    halign = center
    valign = top
    color=$green
}

# month
label {
    monitor =
    text = cmd[update:1] date +"%b"
    font_size = 16
    font_family = $font
    position = 50, -380
    halign = center
    valign = top
    color = $text
}
#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = $font
    position = 100, -382
    halign = center
    valign = top
    color=$blue
}
# Year
label {
    monitor =
    text = cmd[update:1] date +"%Y"
    font_size = 16
    font_family = $font
    position = 150, -380
    halign = center
    valign = top
    color = $text
}

# BATTERY (icono + porcentaje via script externo)
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery.sh
    font_size = 16
    font_family = $font
    position = -40, -30
    halign = right
    valign = top
    color = $text
}
