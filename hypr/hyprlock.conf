source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true # Enter sin contraseña no cuenta como intento fallido
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fade, 1, 1.8, linear
    animation = inputField, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/hypr/assets/bg4.jpg
    blur_passes = 3
    blur_size = 1
    brightness = 0.7 # oscurece un poco para que el texto se lea mejor
}

# ---------------- reloj y fecha (arriba) ----------------

# TIME
label {
    monitor =
    text = cmd[update:1000] date +"%-l:%M"
    font_size = 120
    font_family = $font black
    position = 0, -200
    halign = center
    valign = top
    color = $fg
}

# DATE: dia  •  numero  •  mes  •  año
label {
    monitor =
    text = cmd[update:60000] date +"%a <span color='##$accentAlpha'></span> %-d <span color='##$accentAlpha'></span> %b <span color='##$accentAlpha'></span> %Y"
    font_size = 16
    font_family = $font
    position = 0, -380
    halign = center
    valign = top
    color = $fg
}

# ---------------- bateria (arriba a la derecha, como en waybar) ----------------

# fondo de pildora: el texto mide 66x26 px (6 caracteres mono a 14pt)
# + 14 px de margen a los lados y 7 arriba/abajo
shape {
    monitor =
    size = 94, 40
    rounding = -1
    color = rgba($bgAlpha99)
    position = -20, -20
    halign = right
    valign = top
}

# icono + porcentaje: morado normal, verde cargando, rojo critico
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery.sh
    font_size = 14
    font_family = $fontMono # ancho fijo para que siempre quepa en la pildora
    position = -34, -27
    halign = right
    valign = top
    color = $accent
}

# ---------------- usuario y contraseña (abajo) ----------------

# Profile Picture
image {
    monitor =
    path = ~/.config/hypr/assets/me.jpg
    size = 100
    border_size = 10
    border_color = rgba($fgAlpha33)
    position = 0, 200
    halign = center
    valign = bottom
}

# user
label {
    monitor =
    text = $USER
    font_family = $font
    color = $fg
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 200, 30
    outline_thickness = 3
    inner_color = rgba($bgAlpha99)

    outer_color = rgba($accentAlpha88)
    check_color = $accent        # mientras verifica la contraseña
    fail_color = $red
    capslock_color = $yellow     # borde amarillo si Bloq Mayús esta activo

    font_color = rgba($fgAlpha99)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text =
    fail_text = NUH UH <b>($ATTEMPTS)</b>

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format =67
    dots_size = 0.4
    dots_spacing = 0

    position = 0, 80
    halign = center
    valign = bottom
}
